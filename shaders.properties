# AETHERIS ULTRA — Iris shader pack configuration
# Designed for Minecraft Java 26.3 / Fabric / Iris + Sodium.

screen = <profile> [ATMOSPHERE] [LIGHTING] [POST]
screen.ATMOSPHERE = AETHER_VOLUMETRIC_FOG FOG_DENSITY
screen.LIGHTING = AETHER_SSAO SHADOW_RES SHADOW_DISTANCE
screen.POST = AETHER_GODRAYS AETHER_BLOOM AETHER_VIGNETTE AETHER_GRAIN

screen.columns = 2
screen.ATMOSPHERE.columns = 1
screen.LIGHTING.columns = 1
screen.POST.columns = 1

sliders = FOG_DENSITY SHADOW_DISTANCE

profile.PERFORMANCE = !AETHER_VOLUMETRIC_FOG !AETHER_SSAO !AETHER_GODRAYS !AETHER_BLOOM !AETHER_VIGNETTE !AETHER_GRAIN SHADOW_RES:2048 SHADOW_DISTANCE:96.0
profile.BALANCED = AETHER_VOLUMETRIC_FOG AETHER_SSAO !AETHER_GODRAYS AETHER_BLOOM AETHER_VIGNETTE !AETHER_GRAIN SHADOW_RES:3072 SHADOW_DISTANCE:144.0
profile.ULTRA = AETHER_VOLUMETRIC_FOG AETHER_SSAO AETHER_GODRAYS AETHER_BLOOM AETHER_VIGNETTE AETHER_GRAIN SHADOW_RES:4096 SHADOW_DISTANCE:192.0

# Smooth weather transitions.
wetnessHalflife = 120.0
eyeBrightnessHalflife = 8.0

# Shadow quality is selected through SHADOW_RES / SHADOW_DISTANCE above.
shadowHardwareFiltering = true
shadow.culling = reversed
