# AETHERIS ULTRA — Iris shader pack configuration.
# Target: Minecraft Java 26.3 / Fabric / Iris + Sodium.

iris.features.optional = REVERSED_CULLING
shadow.culling = reversed
shadowEntities = true
shadowPlayer = true
shadowBlockEntities = true
shadowTranslucent = false

blend.gbuffers_water = SRC_ALPHA ONE_MINUS_SRC_ALPHA ONE ZERO

clouds = fancy
sun = true
moon = true
stars = true
vignette = false
underwaterOverlay = false

screen = <profile> [ATMOSPHERE] [LIGHTING] [POST]
screen.ATMOSPHERE = AETHER_VOLUMETRIC_FOG FOG_DENSITY
screen.LIGHTING = AETHER_SSAO shadowMapResolution shadowDistance
screen.POST = AETHER_GODRAYS AETHER_BLOOM AETHER_VIGNETTE

screen.columns = 2
screen.ATMOSPHERE.columns = 1
screen.LIGHTING.columns = 1
screen.POST.columns = 1

sliders = FOG_DENSITY shadowDistance

profile.PERFORMANCE = !AETHER_VOLUMETRIC_FOG !AETHER_SSAO !AETHER_GODRAYS !AETHER_BLOOM !AETHER_VIGNETTE shadowMapResolution:2048 shadowDistance:96.0
profile.BALANCED = AETHER_VOLUMETRIC_FOG AETHER_SSAO !AETHER_GODRAYS AETHER_BLOOM !AETHER_VIGNETTE shadowMapResolution:3072 shadowDistance:144.0
profile.ULTRA = AETHER_VOLUMETRIC_FOG AETHER_SSAO AETHER_GODRAYS AETHER_BLOOM !AETHER_VIGNETTE shadowMapResolution:4096 shadowDistance:192.0

wetnessHalflife = 120.0
eyeBrightnessHalflife = 8.0
