name: Validate and package shader

on:
  push:
    branches: [main]
    paths:
      - "shaders/**"
      - "shaders.properties"
      - ".github/workflows/package.yml"
      - ".github/scripts/validate_glsl.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: Validate and build AETHERIS ULTRA
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install GLSL validator
        run: |
          sudo apt-get update
          sudo apt-get install -y glslang-tools

      - name: Validate GLSL shader stages
        run: python3 .github/scripts/validate_glsl.py

      - name: Package shader pack
        run: |
          mkdir -p dist
          zip -r dist/AETHERIS-ULTRA.zip shaders shaders.properties

      - name: Upload shader pack
        uses: actions/upload-artifact@v4
        with:
          name: AETHERIS-ULTRA
          path: dist/AETHERIS-ULTRA.zip
          if-no-files-found: error
          retention-days: 30
