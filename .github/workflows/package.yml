name: Validate and package shader

on:
  push:
    branches: [main]
    paths:
      - "shaders/**"
      - "shaders.properties"
      - ".github/workflows/package.yml"
      - ".github/scripts/validate_glsl.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: Validate and build AETHERIS ULTRA
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install GLSL validator
        run: |
          sudo apt-get update
          sudo apt-get install -y glslang-tools

      - name: Validate GLSL shader stages
        run: python3 .github/scripts/validate_glsl.py

      - name: Verify shader pack structure
        run: |
          test -f shaders.properties
          test -f shaders/gbuffers_terrain.fsh
          test -f shaders/composite.fsh
          test -f shaders/block.properties

      - name: Upload ready-to-use shader pack
        uses: actions/upload-artifact@v4
        with:
          name: AETHERIS-ULTRA
          path: |
            shaders/
            shaders.properties
          if-no-files-found: error
          retention-days: 30
