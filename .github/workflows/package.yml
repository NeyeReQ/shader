name: Package shader pack

on:
  push:
    branches: [main]
    paths:
      - "shaders/**"
      - "shaders.properties"
      - ".github/workflows/package.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: Build AETHERIS ULTRA ZIP
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Package shader pack
        run: |
          mkdir -p dist
          zip -r dist/AETHERIS-ULTRA.zip shaders shaders.properties

      - name: Upload shader pack
        uses: actions/upload-artifact@v4
        with:
          name: AETHERIS-ULTRA
          path: dist/AETHERIS-ULTRA.zip
          if-no-files-found: error
          retention-days: 30
